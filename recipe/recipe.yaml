schema_version: 1

context:
  version: "4.18.0"

package:
  name: pymongo
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pymongo/pymongo-${{ version }}.tar.gz
  sha256: 6f33cd2033e8ea216d3069b5ebea79ded74ef2a93f69a93b26cf310082f9b5b9

build:
  # Three tests seem to fail on PPC64LE and PyPy
  # test_monitoring test_gridfs_spec test_legacy_api
  number: 2
  script:
    secrets:
      - python_impl
      - target_platform
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-cache-dir --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - hatch-requirements-txt >=0.4.1
    - hatchling >1.24
    - setuptools >=65.0
    - python
    - pip
  run:
    - python
    - dnspython <3.0.0,>=2.7.0

tests:
  - python:
      imports:
        - bson
        - gridfs
        - pymongo
      pip_check: true
  - files:
      recipe:
        - run_the_tests.sh
      source:
        - .
    requirements:
      run:
        - if: not win
          then: mongodb <8
        - if: not win
          then: setuptools
        - pytest >=8.2
        - pytest-asyncio >=0.24.0
        - mockupdb
        - pip
    script:
      - if: unix and not (ppc64le or python_impl=='pypy')
        then: bash run_the_tests.sh

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Python driver for MongoDB http://www.mongodb.org
  homepage: https://github.com/mongodb/mongo-python-driver
  repository: https://github.com/mongodb/mongo-python-driver

extra:
  recipe-maintainers:
    - sleepystick
    - noahstapp
    - aclark4life
    - caseyclements
    - jibola
    - xylar
    - ShaneHarvey
    - blink1073
    - licode
    - tacaswell
    - CJ-Wright
    - jan-janssen
