{% set version = "4.18.0" %}

package:
  name: pymongo
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pymongo/pymongo-{{ version }}.tar.gz
  sha256: 6f33cd2033e8ea216d3069b5ebea79ded74ef2a93f69a93b26cf310082f9b5b9

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-cache-dir --no-build-isolation
  # Three tests seem to fail on PPC64LE and PyPy
  # test_monitoring test_gridfs_spec test_legacy_api
  script_env:
    - python_impl
    - target_platform

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - hatch-requirements-txt >=0.4.1
    - hatchling >1.24
    - setuptools >=65.0
    - python
    - pip
  run:
    - python
    - dnspython <3.0.0,>=2.7.0

test:
  source_files:
    - .
  files:
    - run_the_tests.sh
  imports:
    - bson
    - gridfs
    - pymongo
  requires:
    # osx-64 mongodb >=8.0.23 ships an arm64-only mongod; pin <8 until fixed.
    # See https://github.com/conda-forge/mongodb-feedstock/issues/121.
    - mongodb <8  # [not win]
    - setuptools  # [not win]
    - pytest >=8.2
    - pytest-asyncio >=0.24.0
    - mockupdb
    - pip
  commands:
    - bash run_the_tests.sh  # [unix and not (ppc64le or python_impl=='pypy')]
    - pip check

about:
  home: https://github.com/mongodb/mongo-python-driver
  license: Apache-2.0
  license_file: LICENSE
  summary: Python driver for MongoDB http://www.mongodb.org
  dev_url: https://github.com/mongodb/mongo-python-driver

extra:
  recipe-maintainers:
    - sleepystick
    - noahstapp
    - aclark4life
    - caseyclements
    - jibola
    - xylar
    - ShaneHarvey
    - blink1073
    - licode
    - tacaswell
    - CJ-Wright
    - jan-janssen
